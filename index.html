<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme:bootstrap -->
    <!-- seo:start --><!-- seo:end -->
    <meta name="theme-color" content="#252524" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f0" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Umami analytics excludes code in URL fragments. -->
    <script
      id="umami-tracker"
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="235b3242-186d-4f50-82a3-1ad170a985e3"
      data-domains="tryjs.app,www.tryjs.app"
      data-exclude-hash="true"
    ></script>
    <script>
      if ((location.pathname.replace(/\/+$/, "") || "/") === "/embed") {
        document.documentElement.setAttribute("data-embed", "");
        // Inline editors are demonstrations inside a page, not another visit.
        if (parent !== window && (new URLSearchParams(location.search).has("example") || new URLSearchParams(location.search).has("demo")))
          document.getElementById("umami-tracker").setAttribute("data-auto-track", "false");
      }
    </script>
  </head>
  <body>
    <div id="app"><!-- app:start --><!-- app:end --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
